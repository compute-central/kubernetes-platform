---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: checkout
spec:
  tls:
    - hosts:
        - checkout.staging.example.com
      secretName: checkout-tls
  rules:
    - host: checkout.staging.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: checkout
                port:
                  name: http
