---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: checkout-staging
namePrefix: staging-

resources:
  - ../../base

patches:
  - path: scale.yaml
  - path: ingress-host.yaml

configMapGenerator:
  - name: checkout-config
    behavior: merge
    literals:
      - LOG_LEVEL=debug

images:
  - name: nginxinc/nginx-unprivileged
    newTag: 1.27-alpine
