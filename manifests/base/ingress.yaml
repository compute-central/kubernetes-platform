---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: checkout
  annotations:
    # Annotations are controller-specific. These are ingress-nginx; on Traefik
    # or an AWS ALB controller they are different keys entirely, which is the
    # main reason Gateway API exists.
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - checkout.example.com
      # The Secret is created by cert-manager from the Certificate resource;
      # it is deliberately not committed here.
      secretName: checkout-tls
  rules:
    - host: checkout.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: checkout
                port:
                  name: http
