# Server config for the demo workload, mounted from a ConfigMap into
# /etc/nginx/conf.d/.
#
# It exists because the probes in deployment.yaml ask for /healthz, and a stock
# nginx image answers 404 there. Without this file the startup probe fails 30
# times and the pod never becomes Ready -- which is exactly what CI caught.
#
# Replace this (and the image) with your own application. The manifests do not
# depend on nginx specifically; they depend on *something* serving 200 on the
# path named by the probes.

server {
    # Must match containerPort in deployment.yaml. 8080 rather than 80 because
    # the container runs as a non-root user and cannot bind a privileged port.
    listen 8080;
    listen [::]:8080;
    server_name _;

    # Do not advertise the nginx version in responses or error pages.
    server_tokens off;

    # What the probes hit. Served by nginx itself, so it reports whether this
    # process is healthy -- deliberately not a proxy to a backend, because that
    # would be a readiness question, not a liveness one.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    location / {
        root  /usr/share/nginx/html;
        index index.html;
    }
}
