---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "webapp.fullname" . }}
  labels:
    {{- include "webapp.labels" . | nindent 4 }}
data:
  {{- /*
    Values are quoted because ConfigMap data must be strings. Without the
    quotes, `LISTEN_PORT: 8080` renders as an integer and the API server
    rejects the object.
  */}}
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
