{{- /*
A Helm test. `helm test <release>` runs this Pod and reports whether it
succeeded, which makes it a genuine post-deploy gate rather than a smoke test
someone runs by hand.

The delete policy is `before-hook-creation` and deliberately nothing else.

The obvious choice is `before-hook-creation,hook-succeeded`, and it is wrong:
`hook-succeeded` deletes the Pod the instant it passes, so `helm test --logs`
then fails with

    Error: unable to get pod logs for <release>-test-connection:
    pods "<release>-test-connection" not found

The test passed; reading its output did not. With only
`before-hook-creation`, the Pod survives whether it passed or failed -- so its
logs are always there to read -- and the next `helm test` removes it before
creating the new one, which is what stops a stale Pod blocking the rerun.
*/}}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "webapp.fullname" . }}-test-connection"
  labels:
    {{- include "webapp.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: curl
      image: curlimages/curl:8.11.1
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      args:
        - --fail
        - --silent
        - --show-error
        - --max-time
        - "10"
        - --retry
        - "5"
        - --retry-connrefused
        - "http://{{ include "webapp.fullname" . }}:{{ .Values.service.port }}{{ .Values.probes.path }}"
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 32Mi
