{{- if .Values.networkPolicy.enabled }}
---
# Deny-by-default applies per direction and only once a policy selects the pod.
# Requires a CNI that implements NetworkPolicy: Calico, Cilium and Antrea do,
# flannel does not -- and with flannel these objects are accepted and silently
# ignored, which is worse than an error.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "webapp.fullname" . }}-default-deny
  labels:
    {{- include "webapp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "webapp.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "webapp.fullname" . }}-allow
  labels:
    {{- include "webapp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "webapp.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- range .Values.networkPolicy.allowedNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ $.Values.containerPort }}
  egress:
    # DNS is the rule everyone forgets. Deny-all egress without it means every
    # outbound name lookup fails, which looks like a service outage rather
    # than a policy mistake. UDP and TCP both: resolvers fall back to TCP for
    # large answers.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
