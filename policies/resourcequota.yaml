---
# Namespace-level guardrails for a shared cluster. Apply one pair of these per
# tenant namespace.
#
# The interaction is the part worth knowing: once a ResourceQuota constrains
# requests.cpu or requests.memory, every pod in the namespace MUST declare
# those requests or admission rejects it outright. The LimitRange supplies
# defaults so that rule does not become a daily annoyance.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant-quota
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.memory: 16Gi
    pods: "20"
    persistentvolumeclaims: "4"
    services.loadbalancers: "1"
    # Capping NodePorts matters on a shared cluster: the port range is a
    # cluster-wide resource and one tenant can exhaust it.
    services.nodeports: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: tenant-limits
spec:
  limits:
    - type: Container
      default:
        memory: 256Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "2"
        memory: 4Gi
      min:
        cpu: 10m
        memory: 32Mi
    - type: PersistentVolumeClaim
      max:
        storage: 20Gi
      min:
        storage: 1Gi
